server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for fast JSON dictionary & JS bundle delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache static hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache Lapwing dictionary & curriculum data with revalidation
    location /data/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
